{% extends "base.html" %}

{% block title %}Sign In — IT HelpDesk{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white text-center py-4">
                    <i class="bi bi-shield-lock fs-1"></i>
                    <h4 class="fw-bold mt-2 mb-0">Help Desk Sign In</h4>
                    <small class="text-white-50">Enterprise IT Support Portal</small>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('auth.login') }}">
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email" required placeholder="user@company.com">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-key"></i></span>
                                <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••">
                            </div>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary py-2 fw-semibold">
                                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                            </button>
                        </div>
                    </form>

                    <!-- Quick Demo Credentials for Fast Evaluation -->
                    <div class="card bg-light border-0 p-3 mt-4">
                        <small class="text-muted fw-bold text-uppercase d-block mb-2">
                            <i class="bi bi-lightning-charge-fill text-warning me-1"></i> Quick Evaluation Credentials:
                        </small>
                        <div class="btn-group-vertical w-100 gap-1">
                            <button type="button" class="btn btn-outline-secondary btn-sm text-start" onclick="fillCreds('requester1@company.com', 'pass123')">
                                <span class="badge bg-secondary me-1">Requester</span> requester1@company.com / pass123
                            </button>
                            <button type="button" class="btn btn-outline-secondary btn-sm text-start" onclick="fillCreds('agent1@company.com', 'pass123')">
                                <span class="badge bg-primary me-1">IT Agent</span> agent1@company.com / pass123
                            </button>
                            <button type="button" class="btn btn-outline-secondary btn-sm text-start" onclick="fillCreds('admin@company.com', 'pass123')">
                                <span class="badge bg-danger me-1">Admin</span> admin@company.com / pass123
                            </button>
                        </div>
                    </div>
                </div>
                <div class="card-footer bg-white text-center py-3 border-0">
                    <small class="text-muted">Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a></small>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function fillCreds(email, pass) {
    document.getElementById('email').value = email;
    document.getElementById('password').value = pass;
}
</script>
{% endblock %}
